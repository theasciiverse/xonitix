# Builds Xonitix for the Asciiverse catalog: one archive per target, named
# xonitix-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Each archive holds the binary with the
# licence, readme and PATCHES.md.
#
# Tags look like v1.1-av.1: upstream's version (VERSION in xonitix.cpp),
# then our packaging release. Linux builds are fully static (Alpine,
# musl); macOS builds run natively on a runner of each architecture;
# Windows builds use MSYS2's compilers, linked statically. Xonitix needs
# no libraries. A target that fails to build is left out of the release
# rather than holding back the others.

name: asciiverse-release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: xonitix
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh asciiverse/build.sh
          sudo chown -R "$(id -u):$(id -g)" .
          file build/linux/xonitix
      - name: Package
        run: |
          mkdir -p stage dist
          cp build/linux/xonitix LICENSE README.md PATCHES.md stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build
        run: |
          sh asciiverse/build.sh
          file build/macos/xonitix
          otool -L build/macos/xonitix || true
      - name: Package
        run: |
          mkdir -p stage dist
          cp build/macos/xonitix LICENSE README.md PATCHES.md stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, runner: windows-2025, msystem: UCRT64, pkg: mingw-w64-ucrt-x86_64 }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, msystem: CLANGARM64, pkg: mingw-w64-clang-aarch64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: zip ${{ matrix.pkg }}-cc
      - name: Build
        run: |
          sh asciiverse/build.sh
          file build/windows/xonitix.exe
      - name: Package
        run: |
          mkdir -p stage dist
          cp build/windows/xonitix.exe LICENSE README.md PATCHES.md stage/
          (cd stage && zip -q -r "../dist/$ID-${{ matrix.target }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Xonitix $TAG" \
                 --notes "Xonitix ${TAG%%-av.*} by wildgaru (github.com/garu/Xonitix), built for the Asciiverse catalog: one binary for Linux, macOS and Windows. MIT. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
